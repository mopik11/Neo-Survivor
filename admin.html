<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Survivor | Admin Terminal</title>
    <meta name="description" content="Secure administrative terminal for Neo Survivor server management and player moderation.">
    <meta name="theme-color" content="#020617">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #020617;
            --primary: #10b981;
            --primary-hover: #059669;
            --accent: #f43f5e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* SPOTLIGHT CANVAS */
        #global-spotlight {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        /* GRID BACKGROUND */
        #global-grid {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 1;
            opacity: 0.05;
            background-image: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2248%22%3E%3Cpath d=%22M 48 0 L 0 0 0 48%22 fill=%22none%22 stroke=%22%2364748b%22 stroke-width=%221%22/%3E%3C/svg%3E');
        }

        /* SCREENS */
        .screen { display: none; width: 100%; max-width: 480px; z-index: 10; position: relative; animation: scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .screen.active { display: flex; flex-direction: column; }
        #screen-3 { height: 94vh; justify-content: flex-start; max-width: 98vw; }
        #screen-welcome { max-width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; padding: 0; align-items: center; justify-content: center; background: var(--bg-dark); }

        h2, h1 { font-family: 'Inter', sans-serif; font-weight: 800; margin-bottom: 24px; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
        h2 { font-size: 3rem; color: #fff; text-shadow: 0 4px 20px rgba(255,255,255,0.2); }
        
        /* LIQUID GLASS PANEL */
        .liquid-glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 40px;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .liquid-glass-panel::before {
            content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.1) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }

        /* INPUTS */
        input {
            background: rgba(0, 0, 0, 0.3); border: none; color: var(--text);
            padding: 16px 20px; margin-bottom: 20px; font-family: 'JetBrains Mono', monospace; 
            font-size: 15px; outline: none; border-radius: 14px; width: 100%; transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
        }
        input:focus { box-shadow: inset 0 2px 4px rgba(0,0,0,0.5), 0 0 0 2px #38bdf8; background: rgba(0, 0, 0, 0.5); }
        input::placeholder { color: #64748b; }

        /* BUTTONS */
        button {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.2); color: white; padding: 16px 24px; width: 100%; font-weight: 700; 
            cursor: pointer; border-radius: 14px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); border-color: rgba(255,255,255,0.4); box-shadow: 0 10px 25px rgba(255,255,255,0.1); }
        button:active { transform: translateY(1px); }

        .error-msg { color: var(--accent); margin-top: 16px; min-height: 20px; font-size: 14px; font-weight: 600; text-align: center; }
        
        /* TERMINAL SPECIFICS */
        .terminal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .status-dot { width: 12px; height: 12px; background-color: var(--primary); border-radius: 50%; box-shadow: 0 0 15px var(--primary); animation: pulse 2s infinite; }
        #console-output {
            flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.05); 
            padding: 20px; overflow-y: auto; white-space: pre-wrap; border-radius: 16px; 
            margin-bottom: 20px; font-family: 'JetBrains Mono', monospace; font-size: 14px; 
            line-height: 1.6; text-align: left; box-shadow: inset 0 10px 30px rgba(0,0,0,0.8);
        }
        .controls { display: flex; gap: 16px; align-items: center; background: rgba(0, 0, 0, 0.4); padding: 10px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
        .controls span { color: #38bdf8; font-weight: 800; font-size: 20px; font-family: 'JetBrains Mono', monospace; }
        .controls input { margin-bottom: 0; box-shadow: none; flex: 1; padding: 10px; font-size: 16px; background: transparent !important; }
        .controls input:focus { box-shadow: none; }
        .controls button { width: auto; padding: 12px 28px; border-radius: 12px; margin: 0; }

        /* CYBER HAND ANIMATION */
        @keyframes drawHand {
            0% { stroke-dashoffset: 400; opacity: 0; }
            20% { opacity: 1; filter: drop-shadow(0 0 5px #38bdf8); }
            50% { stroke-dashoffset: 0; filter: brightness(1.5) drop-shadow(0 0 15px #38bdf8); }
            80% { stroke-dashoffset: 0; filter: brightness(1.2) drop-shadow(0 0 10px #c084fc); }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }
        #cyber-hand {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            width: 450px; 
            height: 450px; 
            margin-left: -225px; 
            margin-top: -225px;
            opacity: 0; 
            display: none;
            pointer-events: none; 
            z-index: 0; 
            transition: opacity 0.8s ease, transform 0.1s ease-out;
        }

        /* SCROLLBARS */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        @keyframes scaleUp { from { opacity: 0; transform: scale(0.95) translateY(15px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); } 70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
    </style>
</head>

    <script>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        // GLOBAL SPOTLIGHT LOGIC
        const canvas = document.getElementById('global-spotlight');
        const ctx = canvas.getContext('2d');
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let sX = mouseX, sY = mouseY;
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        
        window.addEventListener('mousemove', e => {
            mouseX = e.clientX; mouseY = e.clientY;
        });

        function animateBg() {
            sX += (mouseX - sX) * 0.1;
            sY += (mouseY - sY) * 0.1;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const r = 400;
            const g = ctx.createRadialGradient(sX, sY, 0, sX, sY, r);
            g.addColorStop(0, 'rgba(56, 189, 248, 0.15)');
            g.addColorStop(0.5, 'rgba(192, 132, 252, 0.05)');
            g.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Parallax grid
            const grid = document.getElementById('global-grid');
            if (grid) {
                const ox = (sX - window.innerWidth/2) * -0.02;
                const oy = (sY - window.innerHeight/2) * -0.02;
                grid.style.transform = `translate(${ox}px, ${oy}px)`;
            }

            // Parallax cyber hand
            const hand = document.getElementById('cyber-hand');
            if (hand) {
                const hx = (sX - window.innerWidth/2) * -0.04;
                const hy = (sY - window.innerHeight/2) * -0.04;
                hand.style.transform = `translate(${hx}px, ${hy}px)`;
            }

            requestAnimationFrame(animateBg);
        }
        requestAnimationFrame(animateBg);


        const socket = io(SERVER_URL, {
            query: { page: 'admin' },
            transports: ['websocket'],
            extraHeaders: { "ngrok-skip-browser-warning": "true" }
        });

        function escapeHtml(str) {
            if (typeof str !== 'string') return String(str || '');
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        function showScreen(num) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('screen-' + num).classList.add('active');
        }

        function log(msg, color = "#e2e8f0") {
            const out = document.getElementById('console-output');
            const div = document.createElement('div');
            div.style.color = color;
            
            if (msg.startsWith('>')) {
                div.innerHTML = `<strong style="color: #64748b;">&gt;</strong> ${escapeHtml(msg.substring(1))}`;
            } else if (msg.startsWith('$')) {
                div.innerHTML = `<strong style="color: #38bdf8;">$</strong> ${escapeHtml(msg.substring(1))}`;
            } else {
                div.innerText = msg;
            }
            
            div.style.marginBottom = "6px";
            out.appendChild(div);
            out.scrollTop = out.scrollHeight;
        }

        function editProp(username, prop, currentVal) {
            const cleanUser = String(username).replace(/[^a-zA-Z0-9_-]/g, '');
            const cleanProp = String(prop).replace(/[^a-zA-Z0-9_.]/g, '');
            const newVal = prompt(`Nastavit novou hodnotu pro '${cleanProp}' hráče ${cleanUser}:`, currentVal);
            if (newVal !== null && newVal !== "") {
                document.getElementById('cmd-input').value = `set ${cleanUser} ${cleanProp} ${newVal}`;
                sendCommand();
                setTimeout(() => { socket.emit('adminCommand', { cmd: `stats ${cleanUser}` }); }, 300);
            }
        }
        
        function setMarketPrice() {
            const val = document.getElementById('input-sp-price').value;
            if (val) {
                document.getElementById('cmd-input').value = `set_price ${val}`;
                sendCommand();
                document.getElementById('input-sp-price').value = '';
            }
        }

        function sendAnnouncement() {
            const input = document.getElementById('announce-input');
            const text = input ? input.value.trim() : '';
            if (text) {
                document.getElementById('cmd-input').value = `announce ${text}`;
                sendCommand();
                if (input) input.value = '';
            }
        }

        function renderStatsTable(data) {
            const out = document.getElementById('console-output');
            const container = document.createElement('div');
            container.style.background = 'rgba(0,0,0,0.4)';
            container.style.border = '1px solid rgba(255,255,255,0.1)';
            container.style.borderRadius = '12px';
            container.style.padding = '20px';
            container.style.marginBottom = '20px';
            container.style.marginTop = '12px';
            
            const cleanUser = escapeHtml(data.username);
            const rawUser = String(data.username).replace(/[^a-zA-Z0-9_-]/g, '');
            
            const onlineDot = data.online ? '<span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#10b981; box-shadow: 0 0 10px #10b981; margin-left:12px;"></span>' 
                                          : '<span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#475569; margin-left:12px;"></span>';
                                          
            container.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 16px; margin-bottom: 16px;">
                    <div style="display: flex; align-items: center;">
                        <span style="font-size: 1.8rem; font-family: 'Inter', sans-serif; font-weight: 800; letter-spacing: 1px; color: #fff;">${cleanUser}</span>
                        ${onlineDot}
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="if(confirm('Opravdu vymazat hráče ${rawUser}?')) { document.getElementById('cmd-input').value = 'delete ${rawUser}'; sendCommand(); setTimeout(() => { socket.emit('adminCommand', { cmd: 'stats' }); }, 300); }" style="width: auto; padding: 8px 16px; margin: 0; font-size: 11px; background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.3); color: #f43f5e;">Smazat</button>
                        <button onclick="document.getElementById('cmd-input').value = 'unlock_all ${rawUser}'; sendCommand(); setTimeout(() => { socket.emit('adminCommand', { cmd: 'stats ${rawUser}' }); }, 300);" style="width: auto; padding: 8px 16px; margin: 0; font-size: 11px; background: rgba(168, 85, 247, 0.1); border-color: rgba(168, 85, 247, 0.3); color: #c084fc;">Unlock All</button>
                    </div>
                </div>
            `;
            
            const table = document.createElement('table');
            table.style.width = '100%';
            table.style.borderCollapse = 'collapse';
            table.style.color = '#e2e8f0';
            table.style.fontSize = '14px';
            
            const meta = data.meta || {};
            const statsObj = meta.stats || {};
            
            const rows = [
                { label: 'Max Level', value: data.level, prop: 'maxLevel' },
                { label: 'DogeCoins', value: meta.currency || 0, prop: 'currency' },
                { label: 'Skill Points (SP)', value: meta.skillPoints || 0, prop: 'skillPoints' },
                { label: 'Total Boss Kills', value: statsObj.totalBossKills || 0, prop: 'stats.totalBossKills' },
                { label: 'Total Games Played', value: statsObj.totalGames || 0, prop: 'stats.totalGames' }
            ];
            
            rows.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #94a3b8;">${r.label}</td>
                    <td style="padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: bold; color: white;">${r.value}</td>
                    <td style="padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: right; width: 40px;">
                        <span style="cursor: pointer; opacity: 0.6; transition: opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.6'" title="Upravit hodnotu" onclick="editProp('${data.username}', '${r.prop}', '${r.value}')">✏️</span>
                    </td>
                `;
                table.appendChild(tr);
            });
            container.appendChild(table);
            
            const rawToggle = document.createElement('div');
            rawToggle.innerHTML = `<span style="color: #94a3b8; font-size: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 2px;" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">RAW Meta Data</span><div style="display:none; background: rgba(0,0,0,0.5); padding: 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); margin-top: 16px; font-size: 12px; max-height: 200px; overflow-y: auto; color: #94a3b8;">${JSON.stringify(meta, null, 2)}</div>`;
            rawToggle.style.marginTop = '16px';
            container.appendChild(rawToggle);
            
            out.appendChild(container);
            out.scrollTop = out.scrollHeight;
        }

        function renderRooms(data) {
            const out = document.getElementById('rooms-output');
            out.innerHTML = '';
            if (!data || data.length === 0) {
                out.innerHTML = '<div style="color: #64748b; text-align: center; margin-top: 20px; font-size: 13px;">Prázdno.</div>';
                return;
            }
            data.forEach(r => {
                const div = document.createElement('div');
                div.style.background = 'rgba(255,255,255,0.03)'; div.style.padding = '16px';
                div.style.borderRadius = '12px'; div.style.border = '1px solid rgba(255,255,255,0.08)';
                div.style.display = 'flex'; div.style.flexDirection = 'column'; div.style.gap = '8px';

                const timeMin = Math.floor((r.time || 0) / 60);
                const timeSec = (r.time || 0) % 60;
                const timeFormatted = `${timeMin}:${timeSec < 10 ? '0' : ''}${timeSec}`;

                const playersHtml = (r.players && r.players.length > 0)
                    ? r.players.map(p => `
                        <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px; font-size: 11px;">
                            <div style="display: flex; align-items: center;">
                                <span style="color: #f8fafc;">${p.name}</span>
                                <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#10b981; box-shadow: 0 0 6px #10b981; margin-left:6px;" title="Online"></span>
                            </div>
                            <span style="color: #38bdf8;">HP: ${p.hp}/${p.maxHp}</span>
                        </div>
                      `).join('')
                    : '<div style="color: #64748b; font-size: 11px;">Prázdná</div>';

                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                        <strong style="color: #fff; font-size: 15px; letter-spacing: 1px;">Místnost #${r.id}</strong>
                        <span style="color: #10b981; font-size: 11px; font-weight: bold; background: rgba(16,185,129,0.15); padding: 2px 8px; border-radius: 6px;">Lvl ${r.level}</span>
                    </div>
                    <div style="color: #94a3b8; font-size: 11px; display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span>Čas: <strong style="color: white;">${timeFormatted}</strong></span>
                        <span>Mód: <strong style="color: white;">${r.isSolo ? 'Solo' : 'Multi'}</strong></span>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px;">
                        ${playersHtml}
                    </div>
                    <button onclick="window.open('./index.html?room=${r.id}', '_blank')" style="margin-top: 10px; padding: 10px; font-size: 11px; font-weight: bold; letter-spacing: 1px;">Připojit se</button>
                `;
                out.appendChild(div);
            });
        }

        function toggleMcPlayers() {
            const box = document.getElementById('mc-players-box');
            if (box) box.style.display = (box.style.display === 'none') ? 'block' : 'none';
        }

        function renderSysStats(data) {
            if (!data) return;
            const ramEl = document.getElementById('stat-ram');
            const cpuEl = document.getElementById('stat-cpu');
            const uptimeEl = document.getElementById('stat-uptime');
            const p3000El = document.getElementById('stat-port-3000');
            const p25565El = document.getElementById('stat-port-25565');
            const mcListEl = document.getElementById('mc-players-list');
            const mcCountEl = document.getElementById('mc-players-count');

            if (ramEl && data.ram) {
                ramEl.innerText = `${data.ram.usedMb} MB (${data.ram.percent}%)`;
                ramEl.style.color = data.ram.percent > 85 ? '#f43f5e' : '#38bdf8';
            }
            if (cpuEl && data.cpuLoad !== undefined) cpuEl.innerText = `${data.cpuLoad}`;
            if (uptimeEl && data.uptime !== undefined) {
                const totalSec = Math.floor(data.uptime);
                const days = Math.floor(totalSec / 86400);
                const hrs = Math.floor((totalSec % 86400) / 3600);
                const mins = Math.floor((totalSec % 3600) / 60);
                if (days > 0) {
                    uptimeEl.innerText = `${days}d ${hrs}h ${mins}m`;
                } else if (hrs > 0) {
                    uptimeEl.innerText = `${hrs}h ${mins}m`;
                } else {
                    uptimeEl.innerText = `${mins}m ${totalSec % 60}s`;
                }
            }
            if (p3000El && data.ports) {
                p3000El.innerText = data.ports[3000] ? 'ONLINE' : 'OFFLINE';
                p3000El.style.color = data.ports[3000] ? '#10b981' : '#f43f5e';
            }
            if (p25565El) {
                const mc = data.mc || {};
                if (mc.online) {
                    p25565El.innerText = `ON (${mc.count || 0} z ${mc.max || '?'})`;
                    p25565El.style.color = '#10b981';
                } else {
                    p25565El.innerText = 'OFF';
                    p25565El.style.color = '#f43f5e';
                }

                if (mcCountEl) mcCountEl.innerText = `${mc.count || 0} z ${mc.max || '?'}`;
                if (mcListEl) {
                    if (!mc.online) { mcListEl.innerText = 'Offline.'; mcListEl.style.color = '#f43f5e'; }
                    else if (mc.players && mc.players.length > 0) mcListEl.innerHTML = mc.players.map(name => `<span style="display:inline-block; background:rgba(16,185,129,0.1); color:#10b981; padding:2px 8px; border-radius:6px; margin:2px; font-weight:bold;">${name}</span>`).join(' ');
                    else mcListEl.innerText = '0 online';
                }
            }
        }

        function renderLeaderboard(data) {
            const out = document.getElementById('leaderboard-output');
            out.innerHTML = '';
            if (!data || data.length === 0) {
                out.innerHTML = '<div style="color: #64748b; text-align: center; margin-top: 20px; font-size: 13px;">Prázdno.</div>';
                return;
            }
            data.forEach((p, i) => {
                const onlineDot = p.online 
                    ? '<span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#10b981; box-shadow: 0 0 6px #10b981; margin-left:8px;"></span>' 
                    : '<span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#475569; margin-left:8px;"></span>';
                    
                const cleanUser = escapeHtml(p.username);
                const rawUser = String(p.username).replace(/[^a-zA-Z0-9_-]/g, '');

                const div = document.createElement('div');
                div.style.background = i < 3 ? 'rgba(251, 191, 36, 0.05)' : 'rgba(255, 255, 255, 0.03)';
                div.style.padding = '12px 16px';
                div.style.borderRadius = '12px';
                div.style.border = i < 3 ? '1px solid rgba(251, 191, 36, 0.2)' : '1px solid rgba(255,255,255,0.05)';
                div.style.display = 'flex'; div.style.justifyContent = 'space-between'; div.style.alignItems = 'center';
                div.style.cursor = 'pointer';
                div.style.transition = 'all 0.2s';
                div.onmouseover = () => { div.style.background = 'rgba(255,255,255,0.1)'; };
                div.onmouseout = () => { div.style.background = i < 3 ? 'rgba(251, 191, 36, 0.05)' : 'rgba(255, 255, 255, 0.03)'; };
                div.onclick = () => { document.getElementById('cmd-input').value = `stats ${rawUser}`; sendCommand(); };
                
                div.innerHTML = `
                    <div style="display: flex; align-items: center; font-size: 14px;">
                        <span style="color: ${i<3 ? '#fbbf24' : '#94a3b8'}; width: 24px; display: inline-block; font-weight: bold;">${i+1}.</span>
                        <span style="color: #f8fafc; font-weight: 600;">${cleanUser}</span>
                        ${onlineDot}
                    </div>
                    <div style="color: #10b981; font-weight: bold; font-size: 13px;">Lvl ${p.max_level}</div>
                `;
                out.appendChild(div);
            });
        }

        socket.on('connect', () => { console.log("Spojení navázáno."); });
        socket.on('adminAuthError', (msg) => { document.getElementById('err-1').innerText = msg; document.getElementById('err-2').innerText = msg; });
        
        socket.on('marketUpdate', (data) => {
            const el = document.getElementById('admin-sp-price');
            if (el) el.innerText = data.price + " Doge";
        });

        socket.on('adminAuthStep', (data) => {
            document.getElementById('err-1').innerText = ""; document.getElementById('err-2').innerText = "";
            if (data.step === 2) showScreen(2);
            if (data.step === 3) {
                updateGreeting();
                showScreen(3);
                
                const welcomeEl = document.getElementById('screen-welcome');
                const welcomeCard = document.getElementById('welcome-modal-card');
                if (welcomeEl && welcomeCard) {
                    welcomeEl.style.display = 'flex';
                    welcomeEl.style.opacity = '1';
                    welcomeCard.classList.remove('welcome-modal-exit');
                    
                    setTimeout(() => {
                        welcomeEl.style.opacity = '0';
                        welcomeCard.classList.add('welcome-modal-exit');
                        setTimeout(() => {
                            welcomeEl.style.display = 'none';
                            
                            // Zapnutí cyber-ruky na 30 sekund po pozdravu
                            const handEl = document.getElementById('cyber-hand');
                            if (handEl) {
                                handEl.style.display = 'block';
                                setTimeout(() => { handEl.style.opacity = '0.18'; }, 50);
                                setTimeout(() => {
                                    handEl.style.opacity = '0';
                                    setTimeout(() => { handEl.style.display = 'none'; }, 800);
                                }, 30000);
                            }
                        }, 450);
                    }, 1800);
                }

                log("===================================================", "#94a3b8");
                log(" SPOJENÍ ZABEZPEČENO. TERMINÁL AKTIVNÍ. ", "#38bdf8");
                log(" Příkazy: set, unlock_all, give, level, stats, rooms", "#94a3b8");
                log("===================================================\n", "#94a3b8");
                
                requestSysStats();
                socket.emit('adminCommand', { cmd: 'rooms' });
                socket.emit('adminCommand', { cmd: 'stats' });
                
                setInterval(() => {
                    requestSysStats();
                    socket.emit('adminCommand', { cmd: 'rooms' });
                    socket.emit('adminCommand', { cmd: 'stats' });
                }, 5000);
            }
        });

        function requestSysStats() {
            socket.emit('adminCommand', { cmd: 'sysstats' });
        }

        function updateGreeting() {
            const userVal = document.getElementById('user-input').value.trim();
            const name = (userVal && userVal.toLowerCase() === 'matej') ? 'MATĚJI' : (userVal ? userVal.toUpperCase() : 'MATĚJI');
            document.getElementById('hero-welcome-title').innerText = `AHOJ ${name}`;
        }

        socket.on('adminResponse', (data) => {
            if (data.type === 'stats' && data.data) renderStatsTable(data.data);
            else if (data.type === 'rooms') renderRooms(data.data);
            else if (data.type === 'sysStats') renderSysStats(data.data);
            else if (data.type === 'leaderboard') renderLeaderboard(data.data);
            else log("> " + data.msg, data.color || '#fff');
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const user = document.getElementById('user-input').value.trim();
            const pass = document.getElementById('pass-input').value.trim();
            if (!user || !pass) return document.getElementById('err-1').innerText = "Vyplňte jméno a heslo.";
            document.getElementById('err-1').innerText = "Ověřování...";
            socket.emit('requestAdminPin', { user, pass });
        });

        document.getElementById('btn-verify').addEventListener('click', () => {
            const user = document.getElementById('user-input').value.trim();
            const pass = document.getElementById('pass-input').value.trim();
            const pin = document.getElementById('pin-input').value.trim();
            if (!pin) return document.getElementById('err-2').innerText = "Zadejte PIN.";
            document.getElementById('err-2').innerText = "Ověřování PINu...";
            socket.emit('verifyAdminPin', { user, pass, pin });
        });

        function sendCommandRaw(cmd) { socket.emit('adminCommand', { cmd: cmd }); }
        
        function sendCommand() {
            const cmdInput = document.getElementById('cmd-input');
            const cmd = cmdInput.value.trim();
            if (!cmd) return;
            log("$ " + cmd, "#10b981");
            sendCommandRaw(cmd);
            cmdInput.value = '';
            
            if (cmd.startsWith('give ') || cmd.startsWith('set ') || cmd.startsWith('level ') || cmd.startsWith('unlock_all ')) {
                setTimeout(() => { sendCommandRaw('stats'); }, 400);
            }
        }

        document.getElementById('btn-send').addEventListener('click', sendCommand);
        document.getElementById('cmd-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendCommand(); });
    </script>
</body>
</html>
